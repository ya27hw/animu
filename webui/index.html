<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Animu: automatic anime downloads, scheduling and library control." />
    <title>Animu Control Panel</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('animu.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-C3TjLHNV.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style-DZawkYon.css">
  </head>

  </body>
</html>
